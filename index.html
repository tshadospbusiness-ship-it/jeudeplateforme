
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASH PIXEL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }
  #titleBar {
    color: #fff;
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 8px;
    margin-bottom: 6px;
    text-shadow: 0 0 10px #a855f7, 0 0 24px #7c3aed;
  }
  #titleBar span { color: #a855f7; }
  #hud {
    display: flex;
    gap: 24px;
    margin-bottom: 6px;
    font-size: 13px;
    color: #ccc;
    letter-spacing: 2px;
  }
  #hud span { color: #fff; font-weight: bold; }
  #powerBar {
    height: 20px;
    margin-bottom: 4px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #ffe066;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  canvas {
    border: 3px solid #a855f7;
    image-rendering: pixelated;
    display: block;
    box-shadow: 0 0 20px #7c3aed88;
  }
  #controls {
    display: flex;
    gap: 10px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #controls button {
    background: #1a0a2e;
    color: #a855f7;
    border: 1.5px solid #a855f7;
    padding: 6px 18px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
  }
  #controls button:hover { background: #2d1060; }
  #mobileButtons {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  .mbtn {
    background: #1a0a2e;
    border: 1.5px solid #a855f7;
    color: #a855f7;
    padding: 8px 22px;
    font-size: 16px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    user-select: none;
  }
  .mbtn.jump { border-color: #ffe066; color: #ffe066; }
  #gameContainer {
    position: relative;
    display: inline-block;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #msgBox {
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    text-align: center;
    background: #0a0a1acc;
    padding: 14px 28px;
    border: 2px solid #a855f7;
    line-height: 2.2;
    display: none;
  }
  #hint {
    margin-top: 6px;
    font-size: 10px;
    color: #444;
    letter-spacing: 2px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="titleBar">DASH <span>PIXEL</span></div>
<div id="hud">
  <div>VIE: <span id="hudLives">❤❤❤</span></div>
  <div>SCORE: <span id="hudScore">0</span></div>
  <div>NIVEAU: <span id="hudLevel">1</span></div>
</div>
<div id="powerBar">⚡ <span id="powerLabel">—</span></div>

<div id="gameContainer">
  <canvas id="gc" width="640" height="360"></canvas>
  <div id="overlay">
    <div id="msgBox"></div>
  </div>
</div>

<div id="controls">
  <button onclick="startGame()">▶ JOUER</button>
  <button onclick="togglePause()">⏸ PAUSE</button>
</div>
<div id="mobileButtons">
  <button class="mbtn" id="btnL">◀</button>
  <button class="mbtn jump" id="btnJ">▲ SAUT</button>
  <button class="mbtn" id="btnR">▶</button>
</div>
<div id="hint">← → : DÉPLACER &nbsp;|&nbsp; Z / ↑ : SAUTER &nbsp;|&nbsp; ENTRÉE : DÉMARRER &nbsp;|&nbsp; ÉCHAP : PAUSE</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = 640, H = 360;
ctx.imageSmoothingEnabled = false;

const keys = {};
let gameState = 'menu';
let paused = false;
let animId;

const TILE = 24;
const GRAVITY = 0.55;
const PLAYER_SPEED = 3.5;
const JUMP_FORCE = -11;

let player, enemies, powerups, particles;
let score, lives, level, cameraX;
let levelData;

const POWERS = [
  { id:'dblJump',   label:'2x SAUT',    color:'#38bdf8' },
  { id:'speed',     label:'TURBO',       color:'#f97316' },
  { id:'highJump',  label:'SUPER SAUT',  color:'#a855f7' },
  { id:'invincible',label:'INVINCIBLE',  color:'#facc15' },
  { id:'grow',      label:'GÉANT',       color:'#4ade80' },
  { id:'extraLife', label:'+VIE',        color:'#f43f5e' },
];

function initPlayer() {
  return {
    x: 80, y: 200, w: 20, h: 20,
    vx: 0, vy: 0,
    onGround: false,
    jumpsLeft: 0,
    facing: 1,
    power: null,
    powerTimer: 0,
    blinkTimer: 0,
    invTimer: 0,
    baseW: 20, baseH: 20,
  };
}

function buildLevel(lvl) {
  const platforms = [];
  const enems = [];
  const pwrs = [];
  const LW = 50 + lvl * 10;

  platforms.push({ x:0, y:H-TILE, w:LW*TILE, h:TILE, type:'ground' });

  const patList = [
    {x:3,y:10},{x:7,y:8},{x:12,y:10},{x:16,y:7},{x:20,y:9},{x:25,y:8},
    {x:28,y:6},{x:33,y:9},{x:37,y:7},{x:40,y:10},{x:43,y:8},{x:47,y:9},
    {x:52,y:10},{x:55,y:7},{x:58,y:9},{x:61,y:8},
  ];
  for (const p of patList) {
    if (p.x < LW - 4) {
      platforms.push({
        x: p.x * TILE,
        y: H - TILE - p.y * TILE * 0.5,
        w: (2 + Math.floor(Math.random() * 3)) * TILE,
        h: TILE,
        type: 'plat'
      });
    }
  }

  const enemCount = 5 + lvl * 2;
  for (let i = 0; i < enemCount; i++) {
    const ex = 3 * TILE + i * Math.floor(LW * TILE / (enemCount + 1));
    enems.push({
      x: ex, y: H - TILE - 20, w: 18, h: 18,
      vx: (0.8 + lvl * 0.2) * (i % 2 === 0 ? 1 : -1),
      vy: 0,
      dir: (i % 2 === 0 ? 1 : -1),
      onGround: false,
      alive: true,
      type: i % 4 === 0 ? 'jumper' : 'walker',
      jumpTimer: Math.floor(Math.random() * 80),
    });
  }

  const pwrCount = 6;
  for (let i = 0; i < pwrCount; i++) {
    const px = 3 * TILE + i * Math.floor(LW * TILE / (pwrCount + 1));
    const pi = i % POWERS.length;
    pwrs.push({
      x: px, y: H - TILE - 40,
      w: 16, h: 16,
      type: POWERS[pi].id,
      label: POWERS[pi].label,
      color: POWERS[pi].color,
      collected: false,
      bobT: i,
    });
  }

  return { platforms, enemies: enems, powerups: pwrs, width: LW * TILE };
}

function startGame() {
  score = 0; lives = 3; level = 1; cameraX = 0;
  player = initPlayer();
  levelData = buildLevel(level);
  enemies = levelData.enemies;
  powerups = levelData.powerups;
  particles = [];
  gameState = 'playing';
  paused = false;
  setMsg(false);
  updateHUD();
  if (!animId) loop();
}

function nextLevel() {
  level++;
  cameraX = 0;
  player = initPlayer();
  levelData = buildLevel(level);
  enemies = levelData.enemies;
  powerups = levelData.powerups;
  particles = [];
  gameState = 'playing';
  setMsg(false);
  updateHUD();
}

function togglePause() {
  if (gameState !== 'playing') return;
  paused = !paused;
  if (paused) setMsg(true, 'PAUSE\n\n[ÉCHAP] REPRENDRE');
  else setMsg(false);
}

function doJump() {
  if (gameState !== 'playing' || paused) return;
  if (player.onGround || player.jumpsLeft > 0) {
    const jf = player.power === 'highJump' ? JUMP_FORCE * 1.6 : JUMP_FORCE;
    player.vy = jf;
    if (!player.onGround) player.jumpsLeft--;
    player.onGround = false;
    spawnParticles(player.x + player.w / 2, player.y + player.h, '#a855f7', 5);
  }
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'ArrowUp' || e.code === 'KeyZ') && gameState === 'playing' && !paused) doJump();
  if (e.code === 'Escape') togglePause();
  if (e.code === 'Enter' && gameState !== 'playing') startGame();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// Boutons mobiles
document.getElementById('btnL').addEventListener('mousedown',  () => keys['ArrowLeft'] = true);
document.getElementById('btnL').addEventListener('mouseup',    () => keys['ArrowLeft'] = false);
document.getElementById('btnL').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowLeft'] = true; }, {passive:false});
document.getElementById('btnL').addEventListener('touchend',   e => { e.preventDefault(); keys['ArrowLeft'] = false; }, {passive:false});
document.getElementById('btnR').addEventListener('mousedown',  () => keys['ArrowRight'] = true);
document.getElementById('btnR').addEventListener('mouseup',    () => keys['ArrowRight'] = false);
document.getElementById('btnR').addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowRight'] = true; }, {passive:false});
document.getElementById('btnR').addEventListener('touchend',   e => { e.preventDefault(); keys['ArrowRight'] = false; }, {passive:false});
document.getElementById('btnJ').addEventListener('mousedown',  () => doJump());
document.getElementById('btnJ').addEventListener('touchstart', e => { e.preventDefault(); doJump(); }, {passive:false});

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 3 - 1.5,
      life: 20 + Math.random() * 20,
      maxLife: 40,
      color,
      size: 3 + Math.random() * 3,
    });
  }
}

function resolveCollisions(obj) {
  obj.onGround = false;
  for (const p of levelData.platforms) {
    const ol = Math.min(obj.x + obj.w, p.x + p.w) - Math.max(obj.x, p.x);
    const ot = Math.min(obj.y + obj.h, p.y + p.h) - Math.max(obj.y, p.y);
    if (ol > 0 && ot > 0) {
      if (ol < ot) {
        obj.x += (obj.x < p.x ? -ol : ol);
        obj.vx = 0;
      } else {
        if (obj.vy >= 0 && obj.y + obj.h - obj.vy <= p.y + 4) {
          obj.y = p.y - obj.h;
          obj.vy = 0;
          obj.onGround = true;
        } else if (obj.vy < 0) {
          obj.y = p.y + p.h;
          obj.vy = 0;
        }
      }
    }
  }
}

function updatePlayer() {
  const spd = player.power === 'speed' ? PLAYER_SPEED * 1.8 : PLAYER_SPEED;
  if (keys['ArrowLeft']  || keys['KeyA']) { player.vx = -spd; player.facing = -1; }
  else if (keys['ArrowRight'] || keys['KeyD']) { player.vx = spd;  player.facing = 1;  }
  else player.vx *= 0.72;

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if (player.onGround) {
    player.jumpsLeft = player.power === 'dblJump' ? 1 : 0;
  }

  resolveCollisions(player);

  if (player.x < 0) player.x = 0;
  if (player.x + player.w >= levelData.width) nextLevel();
  if (player.y > H + 80) loseLife();

  if (player.power) {
    player.powerTimer--;
    if (player.powerTimer <= 0) {
      if (player.power === 'grow') { player.w = player.baseW; player.h = player.baseH; }
      player.power = null;
      document.getElementById('powerLabel').textContent = '—';
      document.getElementById('powerLabel').style.color = '#ffe066';
    }
  }

  if (player.invTimer > 0) player.invTimer--;
  player.blinkTimer = (player.blinkTimer + 1) % 8;
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;
    e.vy += GRAVITY;
    if (e.type === 'jumper') {
      e.jumpTimer++;
      if (e.jumpTimer > 90 && e.onGround) { e.vy = -9; e.jumpTimer = 0; }
    }
    e.x += e.vx;
    e.y += e.vy;
    resolveCollisions(e);
    if (e.onGround) {
      const ahead = { x: e.x + e.dir * (e.w + 2), y: e.y + e.h + 2, w: 2, h: 2 };
      let onEdge = true;
      for (const p of levelData.platforms) {
        if (ahead.x < p.x + p.w && ahead.x + ahead.w > p.x &&
            ahead.y < p.y + p.h && ahead.y + ahead.h > p.y) {
          onEdge = false; break;
        }
      }
      if (onEdge || e.x <= 0 || e.x + e.w >= levelData.width) {
        e.vx *= -1; e.dir *= -1;
      }
    }
    if (e.y > H + 80) e.alive = false;
  }
}

function checkPlayerEnemy() {
  if (player.invTimer > 0 || player.power === 'invincible') return;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (rectsOverlap(player, e)) {
      if (player.vy > 0 && player.y + player.h < e.y + e.h * 0.65) {
        e.alive = false;
        player.vy = -8;
        score += 100;
        updateHUD();
        spawnParticles(e.x + e.w / 2, e.y, '#f97316', 10);
      } else {
        loseLife();
        return;
      }
    }
  }
}

function checkPowerups() {
  for (const pw of powerups) {
    if (pw.collected) continue;
    if (rectsOverlap(player, pw)) {
      pw.collected = true;
      applyPower(pw.type, pw.color, pw.label);
      spawnParticles(pw.x + pw.w / 2, pw.y, pw.color, 12);
      score += 50;
      updateHUD();
    }
  }
}

function applyPower(type, color, label) {
  if (type === 'extraLife') {
    lives++;
    updateHUD();
    const el = document.getElementById('powerLabel');
    el.textContent = '+VIE !';
    el.style.color = color;
    setTimeout(() => { el.textContent = player.power ? '' : '—'; }, 2000);
    return;
  }
  if (player.power === 'grow' && type !== 'grow') { player.w = player.baseW; player.h = player.baseH; }
  if (type === 'grow') { player.w = player.baseW * 2; player.h = player.baseH * 2; }
  player.power = type;
  player.powerTimer = 7 * 60;
  const el = document.getElementById('powerLabel');
  el.textContent = label + ' (7s)';
  el.style.color = color;
}

function loseLife() {
  if (player.invTimer > 0) return;
  lives--;
  player.invTimer = 120;
  spawnParticles(player.x + player.w / 2, player.y, '#f43f5e', 16);
  updateHUD();
  if (lives <= 0) {
    gameState = 'gameover';
    setMsg(true, 'GAME OVER\nSCORE : ' + score + '\n\n[ENTRÉE] REJOUER');
  } else {
    player.x = 80; player.y = 200; player.vx = 0; player.vy = 0;
    player.power = null; player.w = player.baseW; player.h = player.baseH;
    cameraX = 0;
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updateHUD() {
  document.getElementById('hudLives').textContent = '❤'.repeat(Math.max(0, lives));
  document.getElementById('hudScore').textContent = score;
  document.getElementById('hudLevel').textContent = level;
}

function setMsg(show, text) {
  const mb = document.getElementById('msgBox');
  mb.style.display = show ? 'block' : 'none';
  if (text) mb.innerHTML = text.replace(/\n/g, '<br>');
}

let starField = null;
function ensureStars() {
  if (starField) return;
  starField = [];
  for (let i = 0; i < 70; i++) {
    starField.push({ x: Math.random() * W, y: Math.random() * H * 0.75, s: Math.random() > 0.7 ? 2 : 1, b: Math.random() });
  }
}

function darken(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.floor(r*0.45)},${Math.floor(g*0.45)},${Math.floor(b*0.45)})`;
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  ensureStars();
  for (const s of starField) {
    const alpha = 0.25 + 0.45 * Math.abs(Math.sin(Date.now() / 900 + s.b * 10));
    ctx.fillStyle = `rgba(200,180,255,${alpha.toFixed(2)})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  if (gameState === 'menu') {
    ctx.fillStyle = '#0a0a1acc';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px Courier New';
    ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 18;
    ctx.fillText('DASH PIXEL', W/2, H/2 - 30);
    ctx.shadowBlur = 0;
    ctx.font = '14px Courier New';
    ctx.fillStyle = '#ffe066';
    ctx.fillText('APPUIE SUR [JOUER] OU [ENTRÉE]', W/2, H/2 + 14);
    ctx.font = '11px Courier New';
    ctx.fillStyle = '#888';
    ctx.fillText('← → DÉPLACER   Z/↑ SAUTER   ÉCHAP PAUSE', W/2, H/2 + 40);
    ctx.textAlign = 'left';
    return;
  }

  ctx.save();
  ctx.translate(-cameraX, 0);

  // Plateformes
  for (const p of levelData.platforms) {
    if (p.x + p.w < cameraX - 10 || p.x > cameraX + W + 10) continue;
    if (p.type === 'ground') {
      ctx.fillStyle = '#1e1040';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#a855f7';
      for (let tx = p.x; tx < p.x + p.w; tx += TILE) {
        ctx.fillRect(tx, p.y, TILE - 1, 3);
        ctx.fillRect(tx, p.y + 4, 3, TILE - 5);
      }
    } else {
      ctx.fillStyle = '#2d1060';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#7c3aed';
      ctx.fillRect(p.x, p.y, p.w, 3);
      ctx.fillStyle = '#a855f7';
      ctx.fillRect(p.x + 2, p.y + 6, 4, 4);
      ctx.fillRect(p.x + p.w - 6, p.y + 6, 4, 4);
    }
  }

  // Power-ups
  const t = Date.now() / 400;
  for (const pw of powerups) {
    if (pw.collected) continue;
    if (pw.x + pw.w < cameraX - 10 || pw.x > cameraX + W + 10) continue;
    const bob = Math.sin(t + pw.bobT) * 4;
    ctx.fillStyle = pw.color;
    ctx.fillRect(pw.x, pw.y + bob, pw.w, pw.h);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(pw.x + 2, pw.y + bob + 2, 5, 5);
    ctx.fillStyle = darken(pw.color);
    ctx.fillRect(pw.x, pw.y + bob, pw.w, 3);
    ctx.fillRect(pw.x, pw.y + bob, 3, pw.h);
  }

  // Ennemis
  for (const e of enemies) {
    if (!e.alive) continue;
    if (e.x + e.w < cameraX - 10 || e.x > cameraX + W + 10) continue;
    const col = e.type === 'jumper' ? '#f43f5e' : '#fb923c';
    ctx.fillStyle = col;
    ctx.fillRect(e.x, e.y, e.w, e.h);
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(e.x + 3, e.y + 4, 3, 3);
    ctx.fillRect(e.x + e.w - 6, e.y + 4, 3, 3);
    ctx.fillRect(e.x + 5, e.y + 11, e.w - 10, 2);
    ctx.fillStyle = darken(col);
    ctx.fillRect(e.x, e.y, e.w, 3);
    ctx.fillRect(e.x, e.y, 3, e.h);
  }

  // Joueur
  if (!(player.invTimer > 0 && player.blinkTimer < 4)) {
    const px = player.x, py = player.y, pw = player.w, ph = player.h;
    let col = '#38bdf8';
    if (player.power === 'invincible') col = '#facc15';
    else if (player.power === 'speed')    col = '#f97316';
    else if (player.power === 'highJump') col = '#a855f7';
    else if (player.power === 'dblJump') col = '#38bdf8';
    else if (player.power === 'grow')     col = '#4ade80';

    ctx.fillStyle = col;
    ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = '#0a0a1a';
    const eyeX = px + (player.facing > 0 ? pw - 6 : 2);
    ctx.fillRect(eyeX, py + 5, 3, 3);
    ctx.fillStyle = darken(col);
    ctx.fillRect(px, py, pw, 3);
    ctx.fillRect(px, py, 3, ph);
  }

  // Particules
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.floor(p.x), Math.floor(p.y), Math.ceil(p.size), Math.ceil(p.size));
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // Barre de pouvoir
  if (player && player.power && player.power !== 'extraLife') {
    const progress = player.powerTimer / (7 * 60);
    const pw = POWERS.find(p => p.id === player.power);
    if (pw) {
      const bw = 180, bh = 8, bx = W/2 - bw/2, by = 16;
      ctx.fillStyle = '#1a0a2e';
      ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = pw.color;
      ctx.fillRect(bx, by, bw * progress, bh);
      ctx.strokeStyle = pw.color + '88';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, bh);
    }
  }

  // Flèche de fin de niveau
  if (levelData && player) {
    const fx = levelData.width - TILE * 2;
    ctx.fillStyle = '#ffe06699';
    ctx.font = 'bold 22px Courier New';
    ctx.fillText('▶▶', fx - cameraX, H - TILE - 8);
  }
}

function loop() {
  animId = requestAnimationFrame(loop);
  if (!paused && gameState === 'playing') {
    updatePlayer();
    updateEnemies();
    checkPlayerEnemy();
    checkPowerups();
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    cameraX = Math.max(0, Math.min(player.x - W / 3, levelData.width - W));
  }
  draw();
}

loop();
</script>
